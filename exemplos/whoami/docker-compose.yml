# Exemplo de site plugado na borda: o app de teste traefik/whoami.
#
# Este é o compose usado pelo smoke test (testes/smoke.sh) e será o exemplo
# do guia (docs/como-plugar-um-projeto.md). Na VPS, um site fica em
# /opt/apps/<projeto>/ com só este arquivo e um .env.
#
# Exceção consciente: a imagem traefik/whoami é "scratch" (sem shell, sem
# wget), então não dá para rodar um healthcheck dentro dela. Por isso o bloco
# "healthcheck" abaixo está COMENTADO. Em sites reais ele é OBRIGATÓRIO:
# descomente e adapte. O restante do arquivo é idêntico ao que o guia manda.
#
# Variáveis (.env do site):
#   DOMINIO  domínio do site, ex.: exemplo.com

name: whoami

services:
  whoami:
    image: traefik/whoami:v1.12.0
    restart: unless-stopped
    # Sem "ports:": o site não é publicado no host. Todo tráfego entra pelo
    # Traefik, pela rede "proxy". "expose" só documenta a porta interna.
    expose:
      - "80"
    networks:
      - proxy
    # healthcheck:                       # OBRIGATÓRIO em sites reais
    #   test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
    #   # (ou curl, ou o binário do próprio app; use um endpoint de saúde)
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s
    labels:
      # Sem esta label o Traefik ignora o container (exposedByDefault=false).
      - "traefik.enable=true"
      # Rede pela qual o Traefik alcança este container.
      - "traefik.docker.network=proxy"
      # Router: nome único no servidor inteiro (use o nome do projeto).
      - "traefik.http.routers.whoami.rule=Host(`${DOMINIO:?defina DOMINIO no .env}`)"
      # Só HTTPS. O redirecionamento HTTP -> HTTPS é global na borda.
      - "traefik.http.routers.whoami.entrypoints=websecure"
      # Peças compartilhadas da borda (sufixo @file): cabeçalhos de segurança
      # e compressão. O TLS mínimo 1.2 vale sozinho, sem label.
      - "traefik.http.routers.whoami.middlewares=seguranca@file,compressao@file"
      # Router do www: só redireciona (permanente) para o domínio sem www.
      - "traefik.http.routers.whoami-www.rule=Host(`www.${DOMINIO}`)"
      - "traefik.http.routers.whoami-www.entrypoints=websecure"
      - "traefik.http.routers.whoami-www.middlewares=www-para-raiz@file"
      # O redirect não chega ao app, mas todo router precisa de um serviço.
      - "traefik.http.routers.whoami-www.service=whoami"
      # Certificado (emissor): sem certresolver, o Traefik serve o certificado
      # padrão dele, o que basta para o smoke test (domínio fictício). Em sites
      # reais, escolha UM emissor (detalhes e variantes no guia):
      #   le-dns  (domínio na Cloudflare, curinga):
      # - "traefik.http.routers.whoami.tls.certresolver=le-dns"
      # - "traefik.http.routers.whoami.tls.domains[0].main=${DOMINIO}"
      # - "traefik.http.routers.whoami.tls.domains[0].sans=*.${DOMINIO}"
      #   le-http (DNS sem API, nomes exatos; o router www também pede):
      # - "traefik.http.routers.whoami.tls.certresolver=le-http"
      # - "traefik.http.routers.whoami-www.tls.certresolver=le-http"
      # Porta em que o app escuta dentro do container.
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
    name: proxy
