# Pilha de borda: Traefik + docker-socket-proxy + node exporter + Loki e
# Alloy (logs de todos os containers da VPS).
#
# Na VPS este repositório fica em /opt/traefik. Antes do primeiro "up":
#   docker network create proxy     # uma vez por servidor
#   cp .env.example .env            # e preencha
#   docker compose up -d
#
# As versões das imagens são FIXAS (nada de "latest"): atualizar é uma
# decisão consciente, trocando a tag aqui.

name: traefik

services:
  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_healthy
    ports:
      # Únicas portas públicas: 80 e 443.
      - "80:80"
      - "443:443"
      # Painel/API (8080) e métricas (8082): publicados SÓ no loopback da VPS
      # (127.0.0.1), nunca em interface pública. Acesso por túnel SSH
      # (ssh -L); ver README. O painel/API ainda recusa os containers da
      # rede "proxy" (ver a rede "painel" abaixo e o traefik/iniciar.sh).
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8082:8082"
    # O traefik/iniciar.sh preenche os valores ACME do .env na configuração
    # estática e depois executa o Traefik (o YAML não lê variáveis; veja o
    # comentário no topo do script).
    entrypoint: ["/bin/sh", "/etc/traefik/iniciar.sh"]
    environment:
      # staging (padrão) ou producao: vale para os DOIS emissores.
      ACME_AMBIENTE: ${ACME_AMBIENTE:-staging}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Token da Cloudflare para o DNS-01 (le-dns). Lido direto pelo Traefik.
      # Vazio = a pilha sobe igual; só a emissão via le-dns falha.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    volumes:
      # Configuração estática, só leitura. É um MODELO: o iniciar.sh gera a
      # versão final no caminho padrão (/etc/traefik/traefik.yml), que também
      # é onde o comando "traefik healthcheck" procura a configuração.
      - ./traefik/traefik.yml:/etc/traefik/modelo/traefik.yml:ro
      - ./traefik/iniciar.sh:/etc/traefik/iniciar.sh:ro
      # Certificados e contas ACME (um .json por emissor e ambiente, com
      # permissão 600). Diretório do HOST, não volume nomeado: sobrevive a
      # "docker compose down -v" e à recriação do container, e fica fácil de
      # fazer backup. O Docker cria ./acme se não existir (clone novo).
      - ./acme:/acme
      # Peças compartilhadas (configuração dinâmica), só leitura.
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      # Repare: o socket do Docker NÃO é montado aqui.
    tmpfs:
      # Única parte gravável das peças: o iniciar.sh gera ali o router do
      # painel/API a cada partida (o diretório existe no repositório só como
      # ponto de montagem).
      - /etc/traefik/dynamic/gerado
    networks:
      painel:
        # Rota padrão do container por esta rede. É por ela que o Docker
        # entrega as conexões das portas publicadas em 127.0.0.1, então o
        # gateway dela é a origem que o painel/API aceita.
        gw_priority: 1
      proxy: {}    # onde estão os sites
      socket: {}   # só para falar com o socket-proxy
    healthcheck:
      # Usa o endpoint /ping (habilitado em traefik.yml).
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      # Rotação dos logs (acesso JSON + Traefik) pelo Docker: no máximo
      # 5 arquivos de 10 MB.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  socket-proxy:
    # Intermediário entre o Traefik e o Docker: um HAProxy que só repassa os
    # endpoints liberados abaixo (todos de leitura).
    # https://github.com/Tecnativa/docker-socket-proxy
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      # 1 = liberado, 0 = bloqueado. Deixamos tudo explícito para estudo.
      # O que o provedor Docker do Traefik e o Alloy (logs) precisam:
      CONTAINERS: 1   # listar/inspecionar containers (labels, IPs) e ler
                      # os logs deles (GET /containers/{id}/logs, Alloy)
      EVENTS: 1       # ser avisado quando um container sobe/cai
      VERSION: 1      # negociar a versão da API do Docker
      PING: 1         # usado pelo healthcheck abaixo
      NETWORKS: 1     # listar redes (GET /networks): a descoberta de
                      # containers do Alloy (discovery.docker) exige; com
                      # 0 ela falha com 403 e nenhum log é coletado
                      # (conferido)
      # Nenhum método de escrita (POST/PUT/DELETE): só leitura.
      POST: 0
      # O resto fica bloqueado.
      ALLOW_RESTARTS: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      # Só leitura no nível do arquivo também.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # SÓ a rede interna. Nunca na rede "proxy": os sites não podem
      # alcançar a API do Docker. Clientes: Traefik e Alloy.
      - socket
    # Nenhuma porta publicada.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      # Rotação pelo Docker, como no Traefik: no máximo 5 arquivos de 10 MB.
      # Importa aqui: o HAProxy loga cada consulta do Alloy, e esse log NÃO
      # vai para o Loki (descartado no Alloy); só o Docker o guarda.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  node-exporter:
    # Métricas do host (CPU, memória, disco, rede) para o Prometheus do
    # homelab, que as lê por túnel SSH (como as 8080/8082 do Traefik).
    # https://github.com/prometheus/node_exporter
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    # Rede e processos do HOST: é o host que se quer medir. Sem rede do
    # Docker, então fora da rede "proxy": os sites não o alcançam.
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      # SÓ no loopback do host, nunca em interface pública. Acesso por
      # túnel SSH (ssh -L); ver README.
      - --web.listen-address=127.0.0.1:9100
      # Métricas extras em arquivo (.prom): o disco do Loki, medido pelo
      # serviço disco-loki (abaixo).
      - --collector.textfile.directory=/textfile
    volumes:
      # Raiz do host, só leitura (discos e sistemas de arquivos).
      - /:/host:ro,rslave
      - textfile:/textfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # Logs: Alloy (coletor) -> Loki (armazenamento, 30 dias).
  #
  # Exceção consciente à regra "monitoramento fora da VPS": o Loki é o
  # primeiro ARMAZENAMENTO de monitoramento aqui (até então só exporters
  # leves). O log nasce na VPS e se perderia com o PC desligado. O Grafana
  # continua no PC (homelab-monitoring) e consulta pelo túnel SSH, como as
  # métricas. Ver "Logs (Loki e Alloy)" no README.
  # -------------------------------------------------------------------------

  wget-loki:
    # Serviço de uma vez só: copia o BusyBox estático (que traz o wget) para
    # o volume "wget-loki" e termina. A imagem do Loki é "distroless" (sem
    # shell, sem wget), então o healthcheck dele usa este wget. "stable" do
    # BusyBox (as .0 são as instáveis).
    image: busybox:1.36.1-musl
    command: ["cp", "/bin/busybox", "/wget-loki/busybox"]
    volumes:
      - wget-loki:/wget-loki
    network_mode: none
    logging:
      # Rotação pelo Docker, como no Traefik: no máximo 5 arquivos de 10 MB.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  loki:
    # Armazena os logs (modo monolítico, sistema de arquivos). Configuração
    # comentada em loki/loki.yml (retenção, limites de ingestão).
    # https://github.com/grafana/loki/releases (tag SEM o "v")
    image: grafana/loki:3.7.8
    restart: unless-stopped
    depends_on:
      wget-loki:
        condition: service_completed_successfully
    command:
      - -config.file=/etc/loki/loki.yml
      # Trava de segurança do Loki: com o disco do host acima desta fração
      # (0.9 = 90%), o Loki RECUSA linhas novas em vez de encher o disco da
      # VPS. Só o smoke test muda isto (testes/smoke.env), porque a máquina
      # de teste pode estar com o disco cheio.
      - -ingester.wal-disk-full-threshold=${LOKI_LIMITE_DISCO:-0.9}
    ports:
      # SÓ no loopback da VPS, nunca em interface pública. O homelab lê por
      # túnel SSH (usuário "metricas", permitopen="127.0.0.1:3100"); ver
      # README. Sem autenticação: a proteção é esta.
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      # Dados (índice e pedaços) em volume nomeado: sobrevivem à recriação
      # do container. Apagados só por "docker compose down -v".
      - loki-dados:/loki
      - wget-loki:/wget-loki:ro
    networks:
      # Rede própria, FORA da rede "proxy": nenhum site alcança o Loki.
      - logs
    # Memória: o Go devolve memória antes de chegar ao teto (GOMEMLIMIT um
    # pouco abaixo do mem_limit), em vez de o container ser morto (OOM).
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 450MiB
    healthcheck:
      test: ["CMD", "/wget-loki/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      # O /ready só responde 200 uns 15 s depois de subir.
      start_period: 30s
    logging:
      # Rotação pelo Docker, como no Traefik: no máximo 5 arquivos de 10 MB.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  disco-loki:
    # Mede o disco usado pelo Loki a cada 5 min e entrega ao node exporter
    # (arquivo no volume "textfile"). Aparece no painel Logs do homelab.
    # Mesma imagem do wget-loki.
    image: busybox:1.36.1-musl
    restart: unless-stopped
    command: ["sh", "/medir-disco.sh"]
    volumes:
      - ./loki/medir-disco.sh:/medir-disco.sh:ro
      - loki-dados:/loki:ro
      - textfile:/textfile
    network_mode: none
    logging:
      # Rotação pelo Docker, como no Traefik: no máximo 5 arquivos de 10 MB.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  alloy:
    # Coletor: descobre os containers e lê os logs pela API do Docker (via
    # socket-proxy, só leitura) e manda para o Loki. Configuração comentada
    # em alloy/config.alloy (rótulos, separação do log de acesso).
    # https://github.com/grafana/alloy/releases
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    # Usuário "alloy" da imagem, não root (a imagem roda como root por
    # padrão). Não precisa de mais nada: fala com o Docker pela rede.
    user: "473:473"
    depends_on:
      socket-proxy:
        condition: service_healthy
      loki:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      # Posição de leitura de cada container (não duplica nem pula linhas
      # quando o Alloy reinicia).
      - --storage.path=/var/lib/alloy/data
      # Interface de depuração SÓ no loopback do container: sem porta
      # publicada, ninguém de fora a alcança.
      - --server.http.listen-addr=127.0.0.1:12345
      - --disable-reporting
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-dados:/var/lib/alloy/data
      # Repare: o socket do Docker NÃO é montado aqui.
    networks:
      - socket   # API do Docker, pelo socket-proxy (só leitura)
      - logs     # envio ao Loki
    # Nenhuma porta publicada.
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 220MiB
    healthcheck:
      # A imagem não tem wget/curl; o bash fala HTTP direto (/dev/tcp).
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/12345 && printf "GET /-/ready HTTP/1.0\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      # Rotação pelo Docker, como no Traefik: no máximo 5 arquivos de 10 MB.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

volumes:
  loki-dados: {}
  alloy-dados: {}
  wget-loki: {}
  # Métricas em arquivo para o node exporter (escrito pelo disco-loki).
  textfile: {}

networks:
  # Rede compartilhada com os sites. É "externa": criada uma vez no servidor
  # (docker network create proxy) e usada por este compose e pelo compose de
  # cada site. O nome "proxy" faz parte do contrato.
  proxy:
    external: true
    name: proxy

  # Rede só do Traefik, para a origem do túnel SSH: só quem chega pelo host
  # (portas publicadas em 127.0.0.1) usa o gateway desta rede. Nenhum outro
  # container entra aqui. Também é a saída do Traefik para a internet (ACME).
  painel: {}

  # Rede só entre o socket-proxy e os clientes dele (Traefik e Alloy).
  # "internal: true" = sem saída para a internet e sem acesso a partir de
  # outros containers.
  socket:
    internal: true

  # Rede só entre o Alloy e o Loki. NÃO é "internal": o Docker não publica
  # portas de container que só está em rede interna, e o Loki precisa de
  # 127.0.0.1:3100 no host. Nenhum site entra aqui.
  logs: {}
